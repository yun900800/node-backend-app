name: Deploy Node.js Project to Serv00

on:
  push:
    branches:
      - master 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout code on Runner
        uses: actions/checkout@v4

      - name: 2. Install dependencies on Runner
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install --production
        
      # -------------------------------------------------------------
      # 🎯 步骤 3：加载私钥到 ssh-agent
      - name: 3. Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # 加载您的私钥
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          
      # -------------------------------------------------------------
      # 🎯 步骤 4：Deploy Code (使用纯 Rsync)
      - name: 4. Deploy Code & Sync
        # 使用标准的 run 步骤，它会自动继承 ssh-agent 的配置
        run: |
          REMOTE_DIR="/home/${{ secrets.DEPLOY_USER }}/app/node-backend-api/"
          HOST=${{ secrets.DEPLOY_HOST }}
          USER=${{ secrets.DEPLOY_USER }}

          # 统一的 SSH 选项：-o StrictHostKeyChecking=no 解决主机验证失败
          SSH_OPTIONS="-o StrictHostKeyChecking=no -p 22"

          echo "-> 正在创建远程目录（如果不存在）..."
          # 1. 确保目录存在：ssh 命令将通过 ssh-agent 认证
          ssh ${SSH_OPTIONS} ${USER}@${HOST} "mkdir -p ${REMOTE_DIR}"
          
          echo "-> 开始使用 rsync 同步文件..."
          # 2. rsync 传输：通过 -e 参数和 ssh-agent 认证
          rsync -rltDvz --delete -e "ssh ${SSH_OPTIONS}" ./ ${USER}@${HOST}:${REMOTE_DIR}
          
          echo "-> 文件同步完成。"

      - name: 5. Restart Node.js Service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: 22
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            PROJECT_DIR="/home/${{ secrets.DEPLOY_USER }}/app/node-backend-api"
            MAIN_FILE="server.js"
            APP_NAME="node-backend-api" 
            
            # 【✅ 关键修改】：定义日志文件路径，存放在项目根目录
            LOG_FILE="${PROJECT_DIR}/app.log" 

            echo "-> 进入项目目录..."
            cd ${PROJECT_DIR}

            echo "-> 查找并杀死旧进程..."
            
            # 查找逻辑保持不变（依赖于 --name 参数）
            PID=$(ps aux | grep node | grep ${APP_NAME} | grep -v grep | awk '{print $2}')
            
            if [ -z "${PID}" ]; then
                echo "未找到正在运行的旧进程。"
            else
                echo "找到旧进程 PID: ${PID}，正在发送 SIGTERM 信号..."
                kill -15 ${PID}
                sleep 5 
                
                if ps -p ${PID} > /dev/null; then
                    echo "进程未终止，强制杀死 (SIGKILL)..." 
                    kill -9 ${PID}
                else
                    echo "旧进程已安全终止。"
                fi
            fi

            echo "-> 启动新的 Node.js 进程，并将日志写入 ${LOG_FILE}..."
            
            # 【✨ 关键修改】：将所有环境变量直接注入到 nohup 命令中。
            # 必须使用单引号 '...' 来确保值包含特殊字符时不会被 Shell 意外解析。
            # 【DEBUG增强】：在启动前执行一个简单的 echo 检查变量是否成功设置（不输出密码）。
            
            # 1. 设置环境变量，使用单引号保护值
            DB_HOST_VAR='${{ secrets.DB_HOST }}'
            DB_USER_VAR='${{ secrets.DB_USER }}'
            DB_PASSWORD_VAR='${{ secrets.DB_PASSWORD }}'
            DB_PORT_VAR='${{ secrets.DB_PORT }}'
            DB_DATABASE_VAR='${{ secrets.DB_DATABASE }}'
            OPENROUTER_API_KEY_VAR='${{ secrets.OPENROUTER_API_KEY }}'
            
            # 2. 调试检查（仅检查非敏感信息）
            echo "DEBUG: DB_HOST set to $DB_HOST_VAR" 
            echo "DEBUG: DB_USER set to $DB_USER_VAR"
            
            # 3. 启动进程
            # 注意：这里使用了变量赋值的方式，确保变量正确传递给 sh -c 内部。
            nohup sh -c "
              NODE_ENV=production \
              OPENROUTER_API_KEY=${OPENROUTER_API_KEY_VAR} \
              DB_HOST=${DB_HOST_VAR} \
              DB_USER=${DB_USER_VAR} \
              DB_PASSWORD=${DB_PASSWORD_VAR} \
              DB_PORT=${DB_PORT_VAR} \
              DB_DATABASE=${DB_DATABASE_VAR} \
              node ${MAIN_FILE} --name ${APP_NAME}
            " > ${LOG_FILE} 2>&1 &
            NEW_PID=$!
            echo "-> Node.js 服务已启动，新的 PID: ${NEW_PID}"
            echo "-> 日志文件路径: ${LOG_FILE}"
            # ---------------------------------------------------------
            # 【端口检查 - 强烈建议保留】
            sleep 5  # 等待服务启动
            echo "-> 验证 5002 端口是否在监听..."
            ssh_action_check_port_status=$(sockstat -4l | grep 5002)

            if [ -z "${ssh_action_check_port_status}" ]; then
                echo "⚠️ 错误：在 5002 端口上未检测到监听服务！"
                echo "请检查 ${LOG_FILE} 或手动运行 'sockstat -4l | grep 5002'"
            else
                echo "✅ 成功：服务在 5002 端口上运行中。"
            fi
            # ---------------------------------------------------------
            echo "-> 部署完成。"
