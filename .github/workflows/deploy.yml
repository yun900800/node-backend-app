name: Deploy Node.js Project to Serv00

on:
  push:
    branches:
      - master 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout code on Runner
        uses: actions/checkout@v4

      - name: 2. Install dependencies on Runner
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install --production
        
      # -------------------------------------------------------------
      # 🎯 步骤 3：加载私钥到 ssh-agent
      - name: 3. Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # 加载您的私钥
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          
      # -------------------------------------------------------------
      # 🎯 步骤 4：Deploy Code (使用纯 Rsync)
      - name: 4. Deploy Code & Sync
        # 使用标准的 run 步骤，它会自动继承 ssh-agent 的配置
        run: |
          REMOTE_DIR="/home/${{ secrets.DEPLOY_USER }}/app/node-backend-api/"
          HOST=${{ secrets.DEPLOY_HOST }}
          USER=${{ secrets.DEPLOY_USER }}

          # 统一的 SSH 选项：-o StrictHostKeyChecking=no 解决主机验证失败
          SSH_OPTIONS="-o StrictHostKeyChecking=no -p 22"

          echo "-> 正在创建远程目录（如果不存在）..."
          # 1. 确保目录存在：ssh 命令将通过 ssh-agent 认证
          ssh ${SSH_OPTIONS} ${USER}@${HOST} "mkdir -p ${REMOTE_DIR}"
          
          echo "-> 开始使用 rsync 同步文件..."
          # 2. rsync 传输：通过 -e 参数和 ssh-agent 认证
          #    注意：必须排除 .env，否则 --delete 会删掉服务器上的密钥文件
          rsync -rltDvz --delete \
            --exclude='.env' \
            --exclude='app.log' \
            --exclude='.git' \
            -e "ssh ${SSH_OPTIONS}" ./ ${USER}@${HOST}:${REMOTE_DIR}
          
          echo "-> 文件同步完成。"

      - name: 5. Restart Node.js Service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: 22
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            PROJECT_DIR="/home/${{ secrets.DEPLOY_USER }}/app/node-backend-api"
            LOG_FILE="${PROJECT_DIR}/app.log"
            PORT=5002

            cd "${PROJECT_DIR}" || exit 1

            # .env 由 rsync 排除，不会被部署覆盖；缺失时直接失败，
            # 避免应用回退到代码里的默认密钥/默认数据库配置。
            if [ ! -f .env ]; then
              echo "❌ 缺少 ${PROJECT_DIR}/.env，终止部署"
              echo "   请先在服务器上创建 .env (chmod 600) 再重新部署"
              exit 1
            fi

            echo "-> 停止旧进程（按端口 ${PORT} 查找）..."
            OLD_PID=$(sockstat -4 -l 2>/dev/null | awk -v p=":${PORT}" '$6 ~ p"$" {print $3; exit}')
            if [ -n "${OLD_PID}" ]; then
              echo "旧进程 PID: ${OLD_PID}"
              kill -15 "${OLD_PID}" 2>/dev/null
              i=0
              while [ ${i} -lt 5 ]; do
                sleep 1
                ps -p "${OLD_PID}" > /dev/null 2>&1 || break
                i=$((i + 1))
              done
              if ps -p "${OLD_PID}" > /dev/null 2>&1; then
                echo "进程未退出，强制终止..."
                kill -9 "${OLD_PID}" 2>/dev/null
                sleep 1
              fi
            else
              echo "未发现监听 ${PORT} 的进程"
            fi

            echo "-> 启动新进程..."
            nohup node --max-old-space-size=256 server.js >> "${LOG_FILE}" 2>&1 &
            echo "新进程 PID: $!"

            sleep 6

            if sockstat -4 -l 2>/dev/null | grep -q ":${PORT} "; then
              echo "✅ 部署成功：${PORT} 端口已监听"
            else
              echo "❌ 启动失败，最近日志："
              tail -30 "${LOG_FILE}"
              exit 1
            fi

            echo "-> 部署完成。"
